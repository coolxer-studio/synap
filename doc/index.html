<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Synap 文档中心</title>
    <link rel="icon" href="_images/icon.png" type="image/png" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="keywords"
      content="Synap,端点执行器,可配置驱动,Agent,应用安全,主机审计,H5,Spring Boot,Synap Build"
    />
    <meta
      name="description"
      content="Synap 文档中心：集中提供 Server 部署运维、Agent 接入、Synap Build、协议 API、架构安全和开发指南。"
    />
    <meta property="og:title" content="Synap 文档中心" />
    <meta
      property="og:description"
      content="从端点接入、加密传输到风险规则与工程交付的一站式文档。"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//fastly.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <style>
      :root {
        --theme-color: #2764ff;
        --synap-ink: #18233a;
        --synap-soft: #f4f7ff;
      }
      body { color: var(--synap-ink); }
      nav.app-nav li ul { min-width: 120px; }
      .markdown-section { max-width: 980px; }
      .markdown-section blockquote {
        border-left-color: var(--theme-color);
        background: var(--synap-soft);
        padding: 0.8rem 1rem;
      }
      .markdown-section table { display: table; width: 100%; }
      .markdown-section img { border-radius: 10px; }
      .markdown-section pre.mermaid {
        background: transparent;
        text-align: center;
        overflow-x: auto;
      }
      .markdown-section pre.mermaid svg {
        display: inline-block;
        max-width: 100%;
        height: auto;
      }
      .markdown-section pre.mermaid.mermaid-wide-flow svg {
        width: 4400px;
        max-width: none;
      }
      .cover-main img { box-shadow: none; }
      @media (max-width: 768px) {
        .markdown-section { padding: 1.5rem 18px 40px; }
        .markdown-section table { display: block; overflow-x: auto; }
      }
      .markdown-section h1 {
        border-bottom: 2px solid var(--theme-color);
        padding-bottom: 0.4em;
      }
      .markdown-section h2 {
        border-left: 4px solid var(--theme-color);
        padding-left: 12px;
        line-height: 1.4;
      }
      .markdown-section :not(pre) > code {
        color: #c0561e;
        background: #fef3e8;
        padding: 2px 5px;
        border-radius: 3px;
        font-size: 0.9em;
        font-weight: 600;
      }
      .zv-flow {
        text-align: center;
        font-size: 1.15em;
        font-weight: 700;
        padding: 12px 0;
        letter-spacing: 1px;
      }
      .zv-flow .arr {
        color: #aaa;
        font-weight: 400;
        margin: 0 8px;
      }
      .zv-hl {
        color: #c0561e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="app">正在加载 Synap 文档...</div>
    <script>
      window.$docsify = {
        name: 'Synap',
        nameLink: '/',
        auto2top: true,
        coverpage: true,
        loadSidebar: true,
        loadNavbar: true,
        mergeNavbar: true,
        maxLevel: 3,
        subMaxLevel: 2,
        relativePath: false,
        markdown: {
          renderer: {
            code: function (code, language) {
              if (language === 'mermaid') {
                var wideFlowClass = code.indexOf('%% synap-wide-flow %%') !== -1
                  ? ' mermaid-wide-flow'
                  : '';
                return '<pre class="mermaid' + wideFlowClass + '">' + code + '</pre>';
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },
        search: {
          noData: '未找到相关文档',
          paths: 'auto',
          placeholder: '搜索 Synap 文档',
        },
        plugins: [
          function (hook) {
            function renderMermaid() {
              if (!window.mermaid) return;
              window.mermaid.run({
                querySelector: '.mermaid:not([data-processed="true"])',
              }).catch(function (error) {
                console.error('Mermaid render failed', error);
              });
            }

            hook.beforeEach(function (html) {
              return html + '\n\n----\n\nSynap 文档中心';
            });

            hook.doneEach(function () {
              if (window.mermaid) {
                renderMermaid();
              } else {
                window.addEventListener('synap-mermaid-ready', renderMermaid, { once: true });
              }
            });
          },
        ],
      };
    </script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.17.0/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral' });
      window.mermaid = mermaid;
      window.dispatchEvent(new Event('synap-mermaid-ready'));
    </script>
    <script src="//fastly.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  </body>
</html>
