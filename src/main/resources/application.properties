spring.profiles.active=dev
spring.application.name=synap-server

# Zenvis business service reporting (enabled by default)
zenvis.business-service.enabled=${ZENVIS_BUSINESS_SERVICE_ENABLED:true}
zenvis.business-service.base-url=${ZENVIS_BASE_URL:http://localhost:11001}
zenvis.business-service.service-code=${ZENVIS_SERVICE_CODE:synap-server}
zenvis.business-service.service-name=${ZENVIS_SERVICE_NAME:Synap Server}
zenvis.business-service.instance-id=${ZENVIS_INSTANCE_ID:}
zenvis.business-service.version=${ZENVIS_SERVICE_VERSION:0.0.1-SNAPSHOT}
zenvis.business-service.environment=${ZENVIS_SERVICE_ENVIRONMENT:${spring.profiles.active:dev}}
zenvis.business-service.host=${ZENVIS_SERVICE_HOST:}
zenvis.business-service.port=${ZENVIS_SERVICE_PORT:${server.port:11099}}
zenvis.business-service.management-url=${ZENVIS_MANAGEMENT_URL:}
zenvis.business-service.heartbeat-interval-millis=${ZENVIS_HEARTBEAT_INTERVAL_MILLIS:30000}
zenvis.business-service.connect-timeout-millis=${ZENVIS_CONNECT_TIMEOUT_MILLIS:2000}
zenvis.business-service.read-timeout-millis=${ZENVIS_READ_TIMEOUT_MILLIS:3000}
zenvis.business-service.event-queue-capacity=${ZENVIS_EVENT_QUEUE_CAPACITY:100}
zenvis.business-service.time-zone=${ZENVIS_TIME_ZONE:Asia/Shanghai}
