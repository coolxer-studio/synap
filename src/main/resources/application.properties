spring.profiles.active=dev
spring.sc.enabled=${SYNAP_SC_ENABLED:false}
spring.sc.v1.enabled=true
spring.sc.v1.prefix=/sc/v1/message
spring.sc.v1.require-tls=${SYNAP_SC_REQUIRE_TLS:true}
spring.sc.v1.clock-skew=5m
spring.sc.v1.replay-ttl=10m
spring.sc.v1.session-ttl=10m
spring.sc.v1.max-envelope-bytes=500000
# Protected JSON/Base64 wrapper limit; business body remains capped below.
spring.sc.v1.max-plaintext-bytes=360000
spring.sc.v1.max-body-bytes=262144
spring.sc.v1.allowed-suites=P256_HKDF_SHA256_AES256_GCM
synap.sc.enabled=${SYNAP_SC_ENABLED:false}
