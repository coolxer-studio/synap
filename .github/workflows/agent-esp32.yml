name: agent-esp32

on:
  push:
    paths: ['agent-esp32/**', 'README.md', '.github/workflows/agent-esp32.yml']
  pull_request:
    paths: ['agent-esp32/**', 'README.md', '.github/workflows/agent-esp32.yml']

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-esp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-esp32/test/requirements-test.txt
      - run: python -m pip install --requirement test/requirements-test.txt
      - run: python -m pytest -q test
      - run: python -m compileall -q tools test/mock_server.py

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1@sha256:dfa2d076c796769c07c155eba6c672b9f395aec943b2ba3701b73379b5f9e884
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3, esp32s3]
    defaults:
      run:
        shell: bash
        working-directory: agent-esp32
    steps:
      - uses: actions/checkout@v4
      - run: idf.py --version | grep 'v5.5.1'
      - run: idf.py set-target '${{ matrix.target }}'
      - run: idf.py build
      - run: cd test/firmware && idf.py set-target '${{ matrix.target }}' && idf.py build
