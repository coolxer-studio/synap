name: h5-wechat-contract

on:
  push:
    paths:
      - 'src/**'
      - 'deploy/open_config/checker_config/**'
      - 'pom.xml'
      - '.github/workflows/wechat-contract.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'deploy/open_config/checker_config/**'
      - 'pom.xml'

jobs:
  maven-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode test
