name: agent-qt

on:
  push:
    paths:
      - 'agent-qt/**'
      - '.github/workflows/agent-qt.yml'
  pull_request:
    paths:
      - 'agent-qt/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        qt: ['5.15.2', '6.8.3']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true
      - name: Install OpenSSL (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --yes --no-progress
      - name: Configure
        run: cmake -S agent-qt -B agent-qt/build -DSYNAP_AGENT_QT_BUILD_TESTS=ON -DSYNAP_AGENT_QT_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build agent-qt/build --config Release --parallel
      - name: Test
        run: ctest --test-dir agent-qt/build -C Release --output-on-failure
      - name: Install smoke test
        run: cmake --install agent-qt/build --config Release --prefix agent-qt/stage
