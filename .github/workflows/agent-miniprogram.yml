name: agent-miniprogram

on:
  push:
    paths:
      - 'agent-miniprogram/**'
      - 'agent-emulator/**'
      - '.github/workflows/agent-miniprogram.yml'
  pull_request:
    paths:
      - 'agent-miniprogram/**'
      - 'agent-emulator/**'

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: agent-miniprogram/package-lock.json
      - run: npm ci
      - run: npm run ci

  emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-emulator/go.mod
          cache-dependency-path: agent-emulator/go.sum
      - run: go test ./...
