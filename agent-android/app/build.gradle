plugins {
    id 'com.android.application'
}

def secureCommunicationConfig = { String name, String fallback = '' ->
    def value = project.findProperty(name)
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(name)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = fallback
    }
    def escaped = value.toString()
            .replace('\\', '\\\\')
            .replace('"', '\\"')
    return '"' + escaped + '"'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.coolxer.probe.demo"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SYNAP_SC_BASE_URL",
                secureCommunicationConfig("SYNAP_SC_BASE_URL", "http://192.168.0.102:11099")
        buildConfigField "String", "SYNAP_SC_APP_ID",
                secureCommunicationConfig("SYNAP_SC_APP_ID", "synap-android")
        buildConfigField "String", "SYNAP_SC_SERVER_KEY_ID",
                secureCommunicationConfig("SYNAP_SC_SERVER_KEY_ID", "server-key-dev")
        buildConfigField "String", "SYNAP_SC_ENROLLMENT_TOKEN",
                secureCommunicationConfig("SYNAP_SC_ENROLLMENT_TOKEN")
        buildConfigField "String", "SYNAP_SC_TRUST_ANCHOR",
                secureCommunicationConfig("SYNAP_SC_TRUST_ANCHOR",
                        "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEbn5vVUmDNdGt6kinA3qZBrrpk5e39C7NkPzuK8z-_xA1WNmqpmXvUvbplcDfzTnpERMyarM7Xh-w3UFCy7aXOQ")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.10.2'
        }
    }
    ndkVersion '26.1.10909125'
}

dependencies {

    implementation 'com.nex3z:flow-layout:1.3.3'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    implementation project(path: ':probe')
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test:core:1.4.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
}
