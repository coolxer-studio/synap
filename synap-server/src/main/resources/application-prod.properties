spring.application.name=synap-server
server.port=${SERVER_PORT:11099}

# Dynamic configuration files mounted by Docker Compose
rule.engine.groovy.path=${RULE_ENGINE_GROOVY_PATH:/app/config/identify_config/}
checker.config.path=${CHECKER_CONFIG_PATH:/app/config/checker_config/}
punish.config.path=${PUNISH_CONFIG_PATH:/app/config/punish_config/punish_config.json}
msg.api.config.path=${MSG_API_CONFIG_PATH:/app/config/msg_api_config/msg_api_config.json}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
spring.kafka.producer.properties.partitioner.class=com.coolxer.config.KeyHashPartitioner
kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:1}
kafka.topic.replicas=${KAFKA_TOPIC_REPLICAS:1}

# H5/WeChat message idempotency (shared across server instances)
synap.idempotency.store=redis
synap.idempotency.done-ttl=P14D
synap.idempotency.processing-ttl=PT5M
spring.data.redis.host=${REDIS_HOST:redis-service}
synap.vulnerability.osv.path=${SYNAP_VULNERABILITY_OSV_PATH:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
synap.kafka.publish-timeout=${KAFKA_PUBLISH_TIMEOUT:PT5S}

# Only these immediate proxy CIDRs may supply Forwarded/X-Forwarded-For.
# Keep empty for direct exposure; configure the exact gateway networks in production.
synap.network.trusted-proxies=${SYNAP_TRUSTED_PROXIES:}
synap.sequence.store=redis
synap.sequence.ttl=${SYNAP_SEQUENCE_TTL:PT30M}
synap.start-tracking.required-platforms=${SYNAP_START_TRACKING_REQUIRED_PLATFORMS:}
# Production must explicitly list every browser origin. Empty means browser
# cross-origin requests are denied instead of silently allowing all sites.
synap.cors.allowed-origin-patterns=${SYNAP_CORS_ALLOWED_ORIGINS:}
synap.security.app-origins=${SYNAP_APP_ORIGINS:}
synap.security.allow-missing-origin=false
synap.security.max-body-bytes=${SYNAP_MAX_BODY_BYTES:262144}
synap.security.max-facts=${SYNAP_MAX_FACTS:100}
synap.security.max-string-length=${SYNAP_MAX_STRING_LENGTH:8192}
synap.risk.store=redis
synap.risk.ttl=${SYNAP_RISK_TTL:PT30M}
synap.risk.half-life=${SYNAP_RISK_HALF_LIFE:PT15M}

# Downstream services
service.asset.url=${ASSET_SERVICE_URL:http://192.168.1.201:11003}
service.operation.url=${OPERATION_SERVICE_URL:http://192.168.1.201:11004}
service.risk.url=${RISK_SERVICE_URL:http://192.168.1.201:11005}

# Zenvis endpoint; all other options use starter defaults or inferred values.
zenvis.business-service.base-url=${ZENVIS_BASE_URL:http://zenvis-backend:11001}

synap.security.wechat-appids=${SYNAP_WECHAT_APPIDS:}
synap.security.require-wechat-appid=${SYNAP_REQUIRE_WECHAT_APPID:true}
spring.sc.enabled=${SYNAP_SC_ENABLED:false}
synap.sc.enabled=${SYNAP_SC_ENABLED:false}
synap.sc.server-key-id=${SYNAP_SC_SERVER_KEY_ID:}
synap.sc.server-private-key-pkcs8=${SYNAP_SC_SERVER_PRIVATE_KEY:}
synap.sc.server-public-key-spki=${SYNAP_SC_SERVER_PUBLIC_KEY:}
synap.sc.session-record-key=${SYNAP_SC_SESSION_RECORD_KEY:}
synap.sc.allowed-app-ids=${SYNAP_SC_ALLOWED_APP_IDS:}
synap.sc.enrollment-admin-token=${SYNAP_SC_ENROLLMENT_ADMIN_TOKEN:}
