spring.application.name=synap-server
server.port=${SERVER_PORT:11099}

# Dynamic configuration files
rule.engine.groovy.path=${RULE_ENGINE_GROOVY_PATH:src/main/java/com/coolxer/rule/}
checker.config.path=${CHECKER_CONFIG_PATH:deploy/open_config/checker_config/}
punish.config.path=${PUNISH_CONFIG_PATH:deploy/open_config/punish_config/punish_config.json}
msg.api.config.path=${MSG_API_CONFIG_PATH:deploy/open_config/msg_api_config/msg_api_config.json}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
spring.kafka.producer.properties.partitioner.class=com.coolxer.config.KeyHashPartitioner
kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:1}
kafka.topic.replicas=${KAFKA_TOPIC_REPLICAS:1}

# H5/WeChat message idempotency (bounded in-memory store for local development)
synap.idempotency.store=memory
synap.idempotency.done-ttl=P14D
synap.idempotency.processing-ttl=PT5M
synap.kafka.publish-timeout=PT5S
synap.network.trusted-proxies=${SYNAP_TRUSTED_PROXIES:127.0.0.1/32,::1/128}
synap.sequence.store=memory
synap.sequence.ttl=PT30M
synap.sequence.memory.max-entries=100000
synap.start-tracking.required-platforms=${SYNAP_START_TRACKING_REQUIRED_PLATFORMS:}
synap.cors.allowed-origin-patterns=http://localhost:8888,http://127.0.0.1:8888,http://192.168.0.101:8888
synap.security.app-origins=${SYNAP_APP_ORIGINS:}
synap.security.allow-missing-origin=true
synap.security.max-body-bytes=262144
synap.security.max-facts=100
synap.security.max-string-length=8192
synap.risk.store=memory
synap.risk.ttl=PT30M
synap.risk.half-life=PT15M

# Secure communication uses Redis even in the dev profile.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
synap.vulnerability.osv.path=${SYNAP_VULNERABILITY_OSV_PATH:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:Zv!fa6b514adab6ead05214cf0eAa}

# Downstream services
service.asset.url=${ASSET_SERVICE_URL:http://192.168.1.201:11003}
service.operation.url=${OPERATION_SERVICE_URL:http://192.168.1.201:11004}
service.risk.url=${RISK_SERVICE_URL:http://192.168.1.201:11005}

# Zenvis endpoint; all other options use starter defaults or inferred values.
zenvis.business-service.base-url=${ZENVIS_BASE_URL:http://localhost:11001}

synap.security.wechat-appids=
synap.security.require-wechat-appid=false
spring.sc.enabled=true
spring.sc.v1.require-tls=false
synap.sc.enabled=true
