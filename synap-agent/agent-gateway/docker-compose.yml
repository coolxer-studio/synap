# Optional: run the probe together with a single-node Kafka for local testing.
#   docker compose up --build
# Then send traffic to the probe, e.g.:
#   curl -X POST http://localhost:8080/example -H 'Content-Type: application/json' -d '{"a":1}'
# And inspect what landed on the topic:
#   docker compose exec kafka kafka-console-consumer.sh --bootstrap-server kafka:9092 --topic agent-gateway --from-beginning
services:
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9092"

  agent-gateway:
    build: .
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    # Override the target and broker address for the container network.
    command:
      - --target=http://10.10.5.71:8080
      - --kafka-brokers=kafka:9092
      - --kafka-topic=agent-gateway
      - --console=true
